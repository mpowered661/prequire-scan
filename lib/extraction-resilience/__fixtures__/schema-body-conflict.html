<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Starter Plan | Lumen Software</title>
  <link rel="canonical" href="https://lumen.example/starter">
  <!-- og:site_name disagrees with the JSON-LD organization name. -->
  <meta property="og:site_name" content="Lumen Analytics">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Starter Plan",
    "brand": { "@type": "Organization", "name": "Lumen Software" },
    "offers": { "@type": "Offer", "price": "49", "priceCurrency": "USD" }
  }
  </script>
</head>
<body>
  <main>
    <h1>Starter Plan</h1>

    <!-- Schema says the price is 49. The body says 79. A machine reading the
         structured data and a human reading the page get different answers. -->
    <p>Monthly price: $79</p>
    <p>Seats included: 5 seats</p>
    <p>Annual discount: 20%</p>

    <p>The Starter Plan covers small teams getting their first reporting
    workflows in place, with everything needed to publish a dashboard.</p>
  </main>
</body>
</html>
