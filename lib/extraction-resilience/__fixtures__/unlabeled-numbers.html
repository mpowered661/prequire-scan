<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Results | Northwind Analytics</title>
  <link rel="canonical" href="https://northwind.example/results">
  <meta property="og:site_name" content="Northwind Analytics">
  <script type="application/ld+json">
  { "@context": "https://schema.org", "@type": "Organization", "name": "Northwind Analytics" }
  </script>
</head>
<body>
  <main>
    <h1>Results that speak for themselves</h1>

    <h2>By the numbers</h2>

    <!-- Stat tiles: the value is visually adjacent to a label in the rendered
         layout, but in the markup the number stands alone in its own element
         with no textual association. This is the failure mode under test. -->
    <div class="stat-grid">
      <div class="stat"><span class="stat-value">89%</span></div>
      <div class="stat"><span class="stat-value">$4.2M</span></div>
      <div class="stat"><span class="stat-value">312</span></div>
      <div class="stat"><span class="stat-value">99.95%</span></div>
    </div>

    <h2>Our approach</h2>
    <p>We work with mid-market operators to turn reporting into decisions. Our
    engagements are scoped in quarters, not years, and every dashboard we build
    is owned by the client at handoff.</p>

    <p>Contract value: $4.2M</p>
  </main>
</body>
</html>
